inherit_from: config/scannet_cropformer.yaml

dataset: "scannet"

cam:
  img_h: 172
  img_w: 224
  depth_scale: 1000.0
  h_crop: 0
  w_crop: 0
  bound: false

# The converted 3RScan sequences provide an RGB-D image and a CropFormer
# prediction for every frame.  Do not inherit ScanNet's 1-in-10 sampling here:
# sparse sampling prevents short tracks from reaching the instance weight gate.
mapping:
  keyframe_freq: 1

seg:
  seg_add_interval: 1
  # Keep the original 50-frame MaskGraph update cadence.
  merge_kf_interval: 50
  mask_weight_threshold: 5

save:
  save_mesh: false
  # Intermediate frame-500 exports are unnecessary for this experiment.  The
  # final point cloud and checkpoint are still exported explicitly by main.py.
  save_interval: 0
  ckpt_interval: 0

# GaME-style, non-destructive multi-view disappearance detector. It ray-casts
# the pre-integration TSDF, requires depth AND color disagreement in the current
# view, then verifies the old surface against RGB-D and CropFormer masks in
# covisible historical keyframes.
change_detection:
  enabled: true
  interval: 10
  warmup_frames: 30

  depth_threshold: 0.05
  color_error_threshold: 0.10
  require_current_color: true
  min_map_weight: 3.0
  range_map_down_factor: 8
  morph_kernel: 3
  min_region_pixels: 30

  min_conflict_voxels: 50
  min_visible_voxels: 50
  min_conflict_ratio: 0.20
  visibility_depth_tolerance: 0.075

  # Bounded CPU keyframe bank. A frame is kept only after sufficient motion.
  keyframe_min_frame_gap: 5
  keyframe_translation: 0.05
  keyframe_rotation_deg: 5.0
  max_keyframes: 200

  # A current conflict is accepted only if the same old TSDF surface agrees
  # with the original instance masks in at least this many historical views.
  max_validation_views: 8
  min_verified_views: 2
  min_covisible_pixels: 20
  history_depth_tolerance: 0.075
  history_color_tolerance: 0.15
  history_projected_agreement: 0.20
  history_mask_coverage: 0.01
  require_history_color: true

  debug:
    enabled: true
    # Save a depth-comparison preview even when no instance event is accepted.
    # Set to 0 to disable periodic previews.
    preview_interval: 50
    max_history_frames: 6
    gray_value: 128
